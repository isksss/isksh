[package]
name = "isksh"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A portable POSIX-oriented shell written in Rust"
license = "MIT OR Apache-2.0"
repository = ""

[dependencies]
glob = "0.3.3"
regex = "1.11.1"
rustyline = "18.0.1"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "term"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
