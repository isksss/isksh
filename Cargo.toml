[package]
name = "isksh"
version = "0.5.1"
edition = "2024"
rust-version = "1.97.1"
description = "A portable POSIX-oriented shell written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/isksss/isksh"
homepage = "https://github.com/isksss/isksh"
documentation = "https://docs.rs/isksh"
readme = "README.md"
keywords = ["shell", "posix", "command-line", "cross-platform"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.ja.md",
    "/README.zh-CN.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/POSIX-COMPATIBILITY.md",
]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
glob = "0.3.3"
regex = "1.11.1"
rustyline = "18.0.1"
tempfile = "3.23.0"
thiserror = "2.0.17"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "term"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
