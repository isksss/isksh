# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: isksss
    repo_name: isksh
    description: A cross-platform POSIX-oriented shell written in Rust
    asset: isksh-{{.OS}}-{{.Arch}}
    format: raw
    windows_arm_emulation: true
    replacements:
      amd64: x86_64
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      file_format: regexp
      algorithm: sha256
      pattern:
        checksum: ^(\b[A-Fa-f0-9]{64}\b)
    overrides:
      - goos: linux
        replacements:
          arm64: aarch64
      - goos: darwin
        replacements:
          darwin: macos
          arm64: aarch64
    supported_envs:
      - linux
      - windows/amd64
      - darwin/arm64
