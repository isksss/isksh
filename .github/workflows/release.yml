name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build development container
        run: docker compose build dev

      - name: Run all checks and build artifacts
        run: docker compose run --rm dev mise run check-all

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/isksh-linux-x86_64
            dist/isksh-linux-x86_64.sha256
            dist/isksh-linux-aarch64
            dist/isksh-linux-aarch64.sha256
            dist/isksh-windows-x86_64.exe
            dist/isksh-windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows host smoke test
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Run Windows smoke tests
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

  macos-build:
    name: Build and smoke-test macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            artifact: isksh-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            artifact: isksh-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust with mise
        uses: jdx/mise-action@v4
        with:
          install_args: rust

      - name: Build and run macOS binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mise exec -- cargo build --locked --release --target "$TARGET"
          mkdir -p dist
          artifact="dist/$ARTIFACT"
          cp "target/$TARGET/release/isksh" "$artifact"
          test "$("$artifact" -c 'printf macos-ok')" = macos-ok
          shasum -a 256 "$artifact" > "$artifact.sha256"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish-crate:
    name: Publish crate
    needs: [build, windows-smoke, macos-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build development container
        run: docker compose build dev

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: docker compose run --rm -e CARGO_REGISTRY_TOKEN dev mise exec -- cargo publish --locked

  publish-release:
    name: Publish GitHub Release
    needs: [build, windows-smoke, macos-build, publish-crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*${{ github.ref_name }}
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: sha256sum --check dist/*.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "isksh $GITHUB_REF_NAME"

  aqua-smoke-linux:
    name: Install release with aqua on Linux
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.1
          enable_aqua_install: "false"

      - name: Install and run isksh through aqua
        run: bash scripts/aqua-smoke.sh "$GITHUB_REF_NAME"

  aqua-smoke-windows:
    name: Install release with aqua on Windows
    needs: publish-release
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.1
          enable_aqua_install: "false"

      - name: Install and run isksh through aqua
        shell: pwsh
        run: ./scripts/aqua-smoke.ps1 -Version $env:GITHUB_REF_NAME

  aqua-smoke-macos:
    name: Install release with aqua on macOS ${{ matrix.arch }}
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.1
          enable_aqua_install: "false"

      - name: Install and run isksh through aqua
        run: bash scripts/aqua-smoke.sh "$GITHUB_REF_NAME"
