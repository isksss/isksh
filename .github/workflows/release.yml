name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build development container
        run: docker compose build dev

      - name: Run all checks and build artifacts
        run: docker compose run --rm dev mise run check-all

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/isksh-linux-x86_64
            dist/isksh-linux-x86_64.sha256
            dist/isksh-linux-aarch64
            dist/isksh-linux-aarch64.sha256
            dist/isksh-windows-x86_64.exe
            dist/isksh-windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: Windows host smoke test
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Run Windows smoke tests
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

  publish-crate:
    name: Publish crate
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build development container
        run: docker compose build dev

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: docker compose run --rm -e CARGO_REGISTRY_TOKEN dev mise exec -- cargo publish --locked

  publish-release:
    name: Publish GitHub Release
    needs: [build, windows-smoke, publish-crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Verify checksums
        shell: bash
        run: sha256sum --check dist/*.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "isksh $GITHUB_REF_NAME"
