name: Bootstrap crates.io publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  publish:
    name: Publish existing tag to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          package_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml)
          test "$RELEASE_TAG" = "v$package_version"

      - name: Build development container
        run: docker compose build dev

      - name: Verify package
        run: docker compose run --rm dev mise exec -- cargo publish --locked --dry-run

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: docker compose run --rm -e CARGO_REGISTRY_TOKEN dev mise exec -- cargo publish --locked
